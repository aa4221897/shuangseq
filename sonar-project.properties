sonar.projectKey=my_android_app
sonar.projectName=My Lottery Application
sonar.projectVersion=1.0

sonar.sources=app/src/main
sonar.tests=app/src/test
sonar.java.binaries=app/build/intermediates/javac/debug/classes
sonar.kotlin.binaries=app/build/tmp/kotlin-classes/debug
sonar.junit.reportPaths=app/build/test-results/testDebugUnitTest
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
sonar.android.lint.reportPaths=app/build/reports/lint-results*.xml

sonar.language=kotlin
sonar.sourceEncoding=UTF-8
sonar.host.url=http://localhost:9000
sonar.login=${env.SONAR_TOKEN}